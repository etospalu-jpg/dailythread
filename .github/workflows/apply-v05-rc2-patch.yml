name: Apply Daily Thread v0.5 RC2 Patch

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/v0.5.0-rc2/**'
      - '.github/workflows/apply-v05-rc2-patch.yml'

permissions:
  contents: write

concurrency:
  group: daily-thread-v05-rc2-patch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patch archive
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v0.5.0-rc2/part-*.b64 | base64 -d > /tmp/dailythread-v05-rc2.zip
          echo '9b8bbf620d5af50161d9f2f271d8b6e43e414d56e197f5c0b94455310e58e5df  /tmp/dailythread-v05-rc2.zip' | sha256sum -c -
          rm -rf /tmp/dailythread-patch
          mkdir -p /tmp/dailythread-patch
          unzip -q /tmp/dailythread-v05-rc2.zip -d /tmp/dailythread-patch

      - name: Overlay Android and docs
        shell: bash
        run: |
          set -euo pipefail
          SRC='/tmp/dailythread-patch/DailyThread_v0.5.0_rc1_VisualParity_Patch'
          test -d "$SRC/android"
          cp -a "$SRC/android/." android/
          if [ -d "$SRC/docs" ]; then
            mkdir -p docs
            cp -a "$SRC/docs/." docs/
          fi

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android docs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat(android): no-login portrait visual parity v0.5.0-rc2'
          git push
