name: Android RC2 No Login

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/v0.5.0-rc2/**'
      - '.github/workflows/android-rc2-nologin.yml'
  workflow_dispatch:

concurrency:
  group: android-rc2-nologin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v0.5.0-rc2/part-*.b64 | base64 -d > /tmp/dailythread-rc2.zip
          unzip -t /tmp/dailythread-rc2.zip
          rm -rf /tmp/dailythread-rc2 && mkdir -p /tmp/dailythread-rc2
          unzip -q /tmp/dailythread-rc2.zip -d /tmp/dailythread-rc2
          PATCH_ROOT=/tmp/dailythread-rc2/DailyThread_v0.5.0_rc1_VisualParity_Patch
          test -f "$PATCH_ROOT/android/app/src/main/java/com/dailythread/app/ui/DailyThreadRoot.kt"
          cp -R "$PATCH_ROOT/android/." android/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: android
        run: gradle :app:lintDebug --stacktrace
      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DailyThread_v0.5.0-rc2_NoLogin_Portrait.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyThread-v0.5.0-rc2-NoLogin-Portrait
          path: DailyThread_v0.5.0-rc2_NoLogin_Portrait.apk
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DailyThread-v0.5.0-rc2-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
